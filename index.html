<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>OCR Nanonets via Apps Script</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Upload Gambar untuk OCR 📄</h2>
  <input type="file" id="fileInput" accept="image/*,.pdf">
  <button id="uploadBtn">Upload & Extract</button>
  <p id="status"></p>
  <pre id="output"></pre>

  <script>
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const output = document.getElementById('output');

    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyXmKQaYAmPdlelUzc06BYE17UuTJF3sayfL6UzNI0NeP4fc_4VYrggc6sIcWH6M650/exec';

    uploadBtn.addEventListener('click', async () => {
      if (!fileInput.files.length) {
        alert('Pilih file terlebih dahulu!');
        return;
      }

      const file = fileInput.files[0];
      status.textContent = '⏳ Mengunggah dan memproses...';
      output.textContent = '';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: formData
        });

        const text = await response.text();
        console.log(text);

        // Karena response dari Apps Script berupa HTML, kita ambil isi JSON-nya
        const jsonMatch = text.match(/\{[\s\S]*\}/);
        if (jsonMatch) {
          const jsonData = JSON.parse(jsonMatch[0]);
          status.textContent = '✅ Berhasil diekstrak!';
          output.textContent = JSON.stringify(jsonData, null, 2);
        } else {
          throw new Error('Format respons tidak dikenali');
        }

      } catch (error) {
        console.error('Error:', error);
        status.textContent = '❌ Terjadi kesalahan: ' + error.message;
      }
    });
  </script>
</body>
</html>
